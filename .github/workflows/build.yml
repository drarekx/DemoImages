name: Build

# Compiles DemoImages for Apple Silicon and Intel on every pull request and push to main.
# Required status check for merging into main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-14: macos-15 arm64 runners often sit in the queue until GitHub cancels the job.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14 defaults to Xcode 15; use the newest Xcode 16 installed on the image.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Check translations
        run: |
          python3 - <<'EOF'
          import re, sys
          s = open("Sources/DemoImages/Localization.swift").read()
          en = s[s.index("static let en"):s.index("static let ca")]
          ca = s[s.index("static let ca"):]
          keys = lambda t: set(re.findall(r'^\s*"((?:[^"\\]|\\.)*)":', t, re.M))
          E, C = keys(en), keys(ca)
          missing = (E - C) | (C - E)
          used = set()
          import glob
          for f in glob.glob("Sources/DemoImages/*.swift"):
              used |= set(re.findall(r'\btr\("((?:[^"\\]|\\.)*)"', open(f).read()))
          untranslated = used - E
          for k in sorted(missing): print("Only in one table:", k)
          for k in sorted(untranslated): print("tr() key without translation:", k)
          sys.exit(1 if missing or untranslated else 0)
          EOF
