name: Release

# Push a tag like v1.2.0 to build DemoImages.app (universal) and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14: macos-15 arm64 runners often sit in the queue until GitHub cancels the job.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14 defaults to Xcode 15; use the newest Xcode 16 installed on the image.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" ./build-app.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && shasum -a 256 DemoImages.zip | awk '{print $1}' > DemoImages.zip.sha256)
          gh release create "$GITHUB_REF_NAME" build/DemoImages.zip build/DemoImages.zip.sha256 \
            --title "DemoImages $GITHUB_REF_NAME" --generate-notes

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DemoImages
          path: build/DemoImages.zip
