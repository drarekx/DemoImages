<!doctype html>
<!-- DemoImages app icon (design A, "Foto sobre cuadros"). Source of truth for
     Resources/AppIcon.icns: regenerate with scripts/make-icon.sh. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>DemoImages icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap">
<style>
html, body { margin: 0; background: transparent; }
.icon { width: 1024px; height: 1024px; position: relative; font-family: 'JetBrains Mono', Menlo, monospace; }
.squircle { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: #3566E0; overflow: hidden; box-shadow: 0 18px 36px rgba(0,0,0,0.32); }
.checker { position: absolute; left: 132px; top: 168px; width: 470px; height: 400px; border-radius: 30px;
  transform: rotate(-11deg); background-color: #FFFFFF;
  background-image: repeating-conic-gradient(#D5DBE7 0 25%, #FFFFFF 0 50%); background-size: 64px 64px;
  box-shadow: 0 16px 34px rgba(8,14,40,0.30); }
.photo { position: absolute; left: 226px; top: 250px; width: 470px; height: 410px; box-sizing: border-box;
  padding: 22px; border-radius: 30px; transform: rotate(6deg); background: #FFFFFF;
  box-shadow: 0 26px 52px rgba(8,14,40,0.38); display: flex; flex-direction: column; gap: 22px; }
.scene { position: relative; width: 426px; height: 296px; border-radius: 14px; overflow: hidden; background: #7AA2FF; }
.sun { position: absolute; left: 300px; top: 46px; width: 74px; height: 74px; border-radius: 50%; background: #F5C46B; }
.scene svg { position: absolute; left: 0; top: 0; }
.caption { display: flex; align-items: center; gap: 14px; }
.tag { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px;
  background: #3566E0; color: #FFFFFF; font-size: 26px; font-weight: 800; letter-spacing: 0.08em; }
.line { height: 10px; width: 120px; border-radius: 5px; background: #D5DBE7; }
</style>
</head>
<body>
<div class="icon">
  <div class="squircle">
    <div class="checker"></div>
    <div class="photo">
      <div class="scene">
        <div class="sun"></div>
        <svg width="426" height="296" viewBox="0 0 426 296">
          <polygon points="0,296 0,210 110,96 196,176 240,138 426,296" fill="#3D5BB0"/>
          <polygon points="96,296 262,124 426,262 426,296" fill="#26304A"/>
        </svg>
      </div>
      <div class="caption"><span class="tag">DEMO</span><span class="line"></span></div>
    </div>
  </div>
</div>
</body>
</html>
